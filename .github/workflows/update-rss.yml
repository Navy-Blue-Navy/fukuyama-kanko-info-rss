name: Connection Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test connections
        run: |
          echo "========================================"
          echo "1. wwwあり 通常"
          echo "========================================"
          curl -I -L --connect-timeout 15 --max-time 30 \
            https://www.fukuyama-kanko.com/information/ || true

          echo ""
          echo "========================================"
          echo "2. wwwなし 通常"
          echo "========================================"
          curl -I -L --connect-timeout 15 --max-time 30 \
            https://fukuyama-kanko.com/information/ || true

          echo ""
          echo "========================================"
          echo "3. wwwあり IPv4固定"
          echo "========================================"
          curl -4 -I -L --connect-timeout 15 --max-time 30 \
            https://www.fukuyama-kanko.com/information/ || true

          echo ""
          echo "========================================"
          echo "4. wwwなし IPv4固定"
          echo "========================================"
          curl -4 -I -L --connect-timeout 15 --max-time 30 \
            https://fukuyama-kanko.com/information/ || true

          echo ""
          echo "========================================"
          echo "5. DNS確認"
          echo "========================================"
          getent ahosts www.fukuyama-kanko.com || true

          echo ""
          getent ahosts fukuyama-kanko.com || true

          echo ""
          echo "========================================"
          echo "診断終了"
          echo "========================================"
